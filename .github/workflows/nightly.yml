# PR CI never produces a real clip, so a change can break the render pipeline
# and still go green. This runs the real path once a release is published
# (plus manual dispatch). Scheduled daily was dropping unrelated failures when
# nothing in the repo changed.
name: post-release-render

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: End-to-end render
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS)   brew install --quiet ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install numpy Pillow python-dotenv opencv-python-headless

      - name: Render a clip per caption style
        shell: bash
        run: |
          for style in branded hormozi karaoke subtle; do
            echo "::group::$style"
            python scripts/e2e_render.py "$style"
            echo "::endgroup::"
          done

      - name: Render the caption compositions directly
        shell: bash
        run: node remotion/test-render.mjs branded

      - name: Upload the failed render for inspection
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-render-${{ matrix.os }}
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore
